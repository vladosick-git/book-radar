name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RADAR_DATA_DIR: /tmp/book-radar-ci
      RADAR_EMBEDDED_WORKER: '0'
      RADAR_AUTH: '0'
      RADAR_VAULT_KEY_FILE: /tmp/book-radar-ci-vault.key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Create an ephemeral key for isolated encryption tests
        run: python -m backend.protection keygen "$RADAR_VAULT_KEY_FILE"
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng xvfb
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: xvfb-run -a python -m pytest -q
